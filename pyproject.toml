[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "table-diff"
version = "0.1.0"
description = "Staged database-side reconciliation for DuckDB and PostgreSQL"
requires-python = ">=3.12"
dependencies = ["typer>=0.12", "duckdb>=1.1", "psycopg[binary]>=3.2"]

[project.scripts]
table-diff = "table_diff.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
